[package]
name = "draftcraft-io"
description = "DraftCraft file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
draftcraft-geom = { workspace = true }
draftcraft-color = { workspace = true }
draftcraft-doc = { workspace = true }
draftcraft-dxf = { workspace = true }
draftcraft-dwg = { workspace = true }
draftcraft-render = { workspace = true }
draftcraft-fonts = { workspace = true }
draftcraft-solid = { workspace = true, optional = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
miniz_oxide = "0.9"
craft-pdf = { workspace = true, features = ["write", "raster"] }
# PDF paths as the PDF reader hands them over (PDFIMPORT); the version craft-pdf's reader uses.
kurbo = "0.13"
quick-xml = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }

[features]
# 3D solids (docs/solids.md): AutoCAD's 3DSOLIDs and BODYs (ACIS) opened as solids, REGIONs as
# regions, and solids and regions saved as AutoCAD's own; solids saved as
# 3DSOLIDs, through the kernel; and the meshes DraftCraft saved for its solids reopened as solids.
# Without it a solid is saved in the interim form (a drawing without the feature has no solids).
solids = ["dep:draftcraft-solid", "draftcraft-solid/kernel"]

[dev-dependencies]
tiny-skia = { workspace = true }
# Reads plotted PDFs back.
craft-pdf = { workspace = true, features = ["read"] }
